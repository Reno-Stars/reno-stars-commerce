name: CI

# This repo had NO CI at all before 2026-08-15 — nothing to port, so this is
# written from scratch and deliberately modest: it checks what the repo actually
# has (lint + a real build of both packages). There are no test scripts in
# either package.json; adding tests is separate work, and a CI that pretends to
# run tests it does not have is worse than one that admits the gap.
#
# RUNNER NOTES (learned the hard way on the other repos today — the workflow
# ports verbatim between GitHub and Gitea, the RUNNER does not):
#   * runs-on: k8s-heavy. NEVER local-deploy — its DOCKER_HOST is the
#     PRODUCTION docker endpoint.
#   * service containers are reachable by SERVICE NAME, not localhost.
#   * actions/upload-artifact has no backend here; never gate on it.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storefront:
    runs-on: k8s-heavy
    timeout-minutes: 25
    # JOB-LEVEL, not step-level. `next lint` loads next.config, which runs
    # storefront/check-env-variables.js — so LINT refuses without these too, not
    # just build. Scoping them to the build step failed with
    # "🚫 Missing required environment variables" at Lint.
    # NEXT_PUBLIC_* are inlined into every client bundle, so they are public by
    # design; the publishable key is still held in a Gitea org secret rather than
    # committed, because this repo is public on GitHub.
    env:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://supply-admin.reno-stars.com
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_BASE_URL: https://supply.reno-stars.com
      NEXT_PUBLIC_DEFAULT_REGION: ca
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # ⚠️ THIS REPO IS YARN 4 (BERRY), NOT npm. Both packages declare
      # `packageManager: yarn@4.4.0` and ship yarn.lock; there is no
      # package-lock.json, so `npm ci` fails with EUSAGE. Same mistake the
      # invoice-service port made in the other direction (npm ci on a pnpm repo).
      - name: Enable corepack (yarn 4)
        run: corepack enable
      - name: Install (immutable)
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Build
        # NEXT_PUBLIC_* are inlined at build time. These are the public
        # production values, matching storefront/Dockerfile's ARG defaults.
        run: yarn build

  backend:
    runs-on: k8s-heavy
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # ⚠️ THIS REPO IS YARN 4 (BERRY), NOT npm. Both packages declare
      # `packageManager: yarn@4.4.0` and ship yarn.lock; there is no
      # package-lock.json, so `npm ci` fails with EUSAGE. Same mistake the
      # invoice-service port made in the other direction (npm ci on a pnpm repo).
      - name: Enable corepack (yarn 4)
        run: corepack enable
      - name: Install (immutable)
        run: yarn install --immutable
      - name: Build
        run: yarn build
