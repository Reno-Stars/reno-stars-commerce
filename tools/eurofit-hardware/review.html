<!doctype html><html><head><meta charset="utf-8"><title>Eurofit asset review</title><style>body{margin:0;font:15px system-ui;background:#eee;color:#172238}header{padding:20px;background:white}select{padding:10px;width:65%}main{display:grid;grid-template-columns:1fr 1fr}#view{height:600px}img{width:100%;height:570px;object-fit:contain;background:white}#notes{padding:20px}</style></head><body><header><b>Eurofit · source / 3D review</b><p><select id="items"></select> <button id="scene">Change scene</button></p><div id="status"></div></header><main><div><img id="source"></div><div id="view"></div></main><div id="notes"></div><script type="module">
import {CabinetStage} from '../../storefront/public/cabinet-library/vendor/cabinet-stage.js';
const inv=await fetch('./inventory.json').then(r=>r.json());window.products=inv.products.filter(p=>p.model_status==='built');
const stage=window.stage=new CabinetStage(document.querySelector('#view'),s=>document.querySelector('#status').textContent=s,'../../storefront/public/cabinet-library/');
const select=document.querySelector('#items');for(const p of products){const o=document.createElement('option');o.value=p.id;o.textContent=p.supplier_sku+' · '+p.finish;select.append(o)}
window.show=async id=>{const p=products.find(p=>p.id===id);select.value=id;document.querySelector('#source').src='./source/images/'+String(p.family_index).padStart(3,'0')+'-00.jpg';document.querySelector('#notes').textContent=p.family_title+' | '+JSON.stringify(p.dimensions_mm)+' | '+p.model_limitations;await stage.load({sku:id,family:'hardware',model_url:'../../storefront/public'+p.model_url});};select.onchange=()=>show(select.value);let n=0;document.querySelector('#scene').onclick=()=>stage.setSettings({scene:['oak','stone','studio'][++n%3]});await show(products[0].id);window.ready=true;
</script></body></html>
